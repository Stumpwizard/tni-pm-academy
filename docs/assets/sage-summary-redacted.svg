<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1320" viewBox="0 0 1100 1320" role="img" aria-labelledby="t d"><title id="t">Redacted SAGE Job Cost Detail Report training example</title><desc id="d">Three-page schematic showing the field locations of the SAGE summary report. Customer, job, purchase order, cost and profit values are not included. Qty is ignored.</desc><style>text{font-family:Arial,sans-serif;fill:#18251a}.heading{font-size:25px;font-weight:bold}.sub{font-size:17px;font-weight:bold}.small{font-size:13px}.label{font-size:14px}.muted{fill:#5c665e}.box{fill:white;stroke:#a6b2a6;stroke-width:2}.bar{fill:#e0e7df}.line{stroke:#a8b4a8;stroke-width:1}.red{fill:#a12b2b;font-weight:bold}.shade{fill:#edf1ed}</style><rect width="1100" height="1320" fill="#f5f7f5"/><text x="42" y="43" class="heading">SAGE JOB COST DETAIL REPORT — TRAINING REFERENCE</text><text x="42" y="70" class="label muted">Sanitized schematic based on the three-page summary layout. No customer or financial values shown.</text><g transform="translate(35 100)"><rect class="box" width="1030" height="410" rx="8"/><rect class="bar" width="1030" height="43" rx="8"/><text x="18" y="28" class="sub">PAGE 1 — COST CENTER DETAIL</text><text x="20" y="73" class="label">Job Number: [REDACTED]    Job Description: [REDACTED]</text><text x="20" y="105" class="sub">UNITS</text><text x="555" y="105" class="sub">DOLLARS</text><rect x="16" y="118" width="998" height="53" class="shade"/><text x="25" y="138" class="small">Cost center</text><text x="210" y="138" class="small">Quoted</text><text x="300" y="138" class="small">Actual</text><text x="390" y="138" class="small">Projected</text><text x="480" y="138" class="small">Quote vs.</text><text x="480" y="155" class="small">Projected</text><text x="580" y="138" class="small">Quoted</text><text x="670" y="138" class="small">Actual</text><text x="750" y="138" class="small">Projected</text><text x="840" y="138" class="small">Open PO</text><text x="920" y="138" class="small">Actual +</text><text x="920" y="155" class="small">Open</text><text x="24" y="199" class="label">Main Cost Center</text><text x="24" y="230" class="label">Sub Cost Center</text><text x="24" y="265" class="label">Cost center total</text><g class="muted" font-size="16"><text x="220" y="265">—</text><text x="305" y="265">—</text><text x="405" y="265">—</text><text x="495" y="265">—</text><text x="585" y="265">—</text><text x="675" y="265">—</text><text x="760" y="265">—</text><text x="850" y="265">—</text><text x="940" y="265">—</text></g><line x1="18" y1="283" x2="1010" y2="283" class="line"/><text x="24" y="310" class="label">Additional columns: Quote vs. Projected (dollars); Projected Over/Under</text><rect x="18" y="333" width="994" height="54" rx="5" fill="#fce9e9"/><text x="30" y="354" class="red">Qty column: IGNORE for this report</text><text x="30" y="374" class="small">Compare labor hours and spending by matching cost centers to the job Cost Detail spreadsheet.</text></g><g transform="translate(35 530)"><rect class="box" width="1030" height="345" rx="8"/><rect class="bar" width="1030" height="43" rx="8"/><text x="18" y="28" class="sub">PAGE 2 — JOB SUMMARY</text><text x="20" y="74" class="label">Job total — quoted / actual / projected units and dollars, open PO and over/under</text><line x1="18" y1="91" x2="1012" y2="91" class="line"/><text x="20" y="126" class="sub">Job Value</text><text x="20" y="152" class="label">Customer PO: [REDACTED]     Total Value: [REDACTED]</text><text x="20" y="195" class="sub">Quote Summary</text><text x="20" y="220" class="label">Job Costs / Profit / Profit %: [REDACTED]</text><text x="20" y="260" class="sub">Projected Summary</text><text x="20" y="285" class="label">Job Costs / Profit / Profit %: [REDACTED]</text><text x="570" y="195" class="sub">Actual Summary</text><text x="570" y="220" class="label">Job Costs / Profit / Profit %: [REDACTED]</text><text x="570" y="260" class="sub">Percentage Complete</text><text x="570" y="285" class="label">[REDACTED] — not physical build progress</text></g><g transform="translate(35 895)"><rect class="box" width="1030" height="330" rx="8"/><rect class="bar" width="1030" height="43" rx="8"/><text x="18" y="28" class="sub">PAGE 3 — JOB LABOR COST</text><text x="25" y="84" class="label">Actual Labor Hours: [REDACTED]</text><text x="25" y="122" class="label">Actual Labor Cost: [REDACTED]</text><text x="25" y="160" class="label">Overhead Rate Per Hour: [REDACTED]</text><text x="25" y="198" class="label">Total Actual Labor Cost: [REDACTED]</text><text x="560" y="84" class="label">Projected Labor Hours: [REDACTED]</text><text x="560" y="122" class="label">Projected Labor Cost: [REDACTED]</text><text x="560" y="160" class="label">Estimated Hourly Cost: [REDACTED]</text><line x1="18" y1="235" x2="1012" y2="235" class="line"/><text x="25" y="265" class="label">PM: Review summary weekly → compare to Cost Detail → use detailed SAGE report if a concern appears.</text><text x="25" y="292" class="small muted">Illustrative field-location diagram only; not an exported SAGE report.</text></g><text x="42" y="1260" class="label muted">TNi PM Academy · Sanitized visual training aid · No real project identifiers or financial data</text></svg>